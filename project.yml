name: LooseTagReporter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: LooseTagReporter/Config/Debug.xcconfig
  Release: LooseTagReporter/Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  TagReportingCore:
    path: Packages/TagReportingCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  LooseTagReporter:
    type: application
    platform: iOS
    sources:
      - path: LooseTagReporter
        excludes:
          - Config/**
          - Features/.gitkeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.loosetagreporter
        INFOPLIST_FILE: LooseTagReporter/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LooseTagReporter/LooseTagReporter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: TagReportingCore
      - package: GRDB
        product: GRDB
      - package: Supabase
        product: Supabase
    preBuildScripts:
      - name: Layering Guardrail
        script: |
          bash "${SRCROOT}/Scripts/layering_guardrail.sh"
        basedOnDependencyAnalysis: false

  LooseTagReporterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LooseTagReporterTests
        excludes:
          - Fixtures/**
      - path: LooseTagReporterTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: LooseTagReporter
      - package: TagReportingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.loosetagreporter.tests
        PRODUCT_NAME: LooseTagReporterTests

  LooseTagReporterSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LooseTagReporterSnapshotTests
    dependencies:
      - target: LooseTagReporter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.loosetagreporter.snapshottests
        PRODUCT_NAME: LooseTagReporterSnapshotTests

schemes:
  LooseTagReporter:
    build:
      targets:
        LooseTagReporter: all
    test:
      targets:
        - LooseTagReporterTests
        - LooseTagReporterSnapshotTests
